version: '3.8'

# ─── MAJAL ISP — Production Docker Compose ───────────────────────────────────
# Database: Supabase (external PostgreSQL — set DATABASE_URL in backend env)
# Backend:  Node.js / Express / Prisma
# Frontend: React / Vite (served by Nginx)
# WireGuard: host network mode — requires Linux host with kernel WireGuard module
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: majalisp-backend
    env_file:
      - ./backend/.env          # copy from .env.example and fill real values
    environment:
      NODE_ENV: "production"
      PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - majalisp-network
    restart: unless-stopped
    volumes:
      - ./backend/logs:/app/logs

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:5000/api}"
    container_name: majalisp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - majalisp-network
    restart: unless-stopped

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: majalisp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - majalisp-network
    restart: unless-stopped

networks:
  majalisp-network:
    driver: bridge

# No local postgres volume — database is Supabase (external)
